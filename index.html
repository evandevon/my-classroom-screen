<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My Classroom Screen</title>
  <meta name="description" content="A free classroom display with timers, noise meter, name picker, whiteboard and more. Everything saves in your browser." />
  <meta name="theme-color" content="#3a5ccc" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="pill" aria-label="Menu and screens" aria-controls="drawer">☰</button>
    <button id="screen-name" class="pill name" title="Tap to rename">My Classroom Screen</button>
    <span class="spacer"></span>
    <button id="fullscreen-btn" class="pill" title="Full screen (F)" aria-label="Full screen">⛶</button>
  </header>

  <main id="board" aria-label="Classroom screen"></main>

  <nav class="dock" aria-label="Add a widget">
    <button id="dock-toggle" class="dock-toggle" aria-expanded="true" aria-label="Show or hide the widget bar">▾</button>
    <div id="dock-items" class="dock-items"></div>
  </nav>

  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="Menu"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript>My Classroom Screen needs JavaScript turned on.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
